<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>room</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#ffffff;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
canvas{display:block;}
/* ---- 对话框：沿用房间的线描语言，无圆角、无阴影、1px 黑边，夜晚整体反相 ---- */
#chat{position:fixed;left:16px;bottom:16px;width:296px;z-index:10;background:#fff;color:#000;border:1px solid #000;display:flex;flex-direction:column;
  font:13px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;}
#log{height:170px;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:5px;overscroll-behavior:contain;}
#log::-webkit-scrollbar{width:4px;}
#log::-webkit-scrollbar-thumb{background:#000;}
#log .u{opacity:.4;}
#log .a::before{content:"· ";}
#inrow{display:flex;border-top:1px solid #000;}
#msg{flex:1;min-width:0;border:0;outline:0;padding:9px 12px;font:inherit;color:inherit;background:transparent;user-select:text;-webkit-user-select:text;}
#msg::placeholder{color:currentColor;opacity:.35;}
#send{border:0;border-left:1px solid #000;background:transparent;color:inherit;font:inherit;padding:0 13px;cursor:pointer;}
#send:hover{opacity:.55;}
#bubble{position:fixed;transform:translate(-50%,-112%);z-index:11;background:#fff;color:#000;border:1px solid #000;padding:4px 9px;max-width:190px;white-space:pre-wrap;pointer-events:none;
  font:13px/1.5 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;opacity:0;transition:opacity .2s;}
#bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:7px;height:7px;background:#fff;border-right:1px solid #000;border-bottom:1px solid #000;transform:translateX(-50%) rotate(45deg);}
#bubble.on{opacity:1;}
body.night #chat,body.night #bubble{background:#000;color:#fff;border-color:#fff;}
body.night #inrow,body.night #send{border-color:#fff;}
body.night #bubble::after{background:#000;border-color:#fff;}
body.night #log::-webkit-scrollbar-thumb{background:#fff;}
/* 右下角常驻的操作提示：不能吃指针事件，否则挡住拾取 */
#hint{position:fixed;right:14px;bottom:15px;z-index:9;pointer-events:none;opacity:.35;color:#000;
  font:11px/1.5 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;}
body.night #hint{color:#fff;}
</style>
</head>
<body>
<div id="chat" class="ui">
  <div id="log"></div>
  <div id="inrow"><input id="msg" class="ui" placeholder="和小线说点什么…" autocomplete="off" spellcheck="false"><button id="send" class="ui">↵</button></div>
</div>
<div id="bubble"></div>
<div id="hint">拖动旋转 · 滚轮缩放</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
<script src="audio.js"></script>
<script>
(function(){
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xffffff);
const camera=new THREE.PerspectiveCamera(38,window.innerWidth/window.innerHeight,0.1,200);
/* --- 轨道相机：球坐标 + 注视点。room 那套是从原来的 (14,10.5,14) → (0,1.9,0) 反算出来的，
       所以默认视角和以前一像素不差；yard 那套从院子右后上方看，能同时看到院子、门廊和房子背面。 --- */
const PRESET={
  room:{az:0.7854,pol:1.1608,r:21.587,t:[0,1.9,0]},
  yard:{az:2.60,pol:0.72,r:14.5,t:[-0.5,1.3,-10.3]}
};
const view={az:PRESET.room.az,pol:PRESET.room.pol,r:PRESET.room.r,t:PRESET.room.t.slice()};
let viewGoal=null,viewZone='room';
function applyCamera(){
  camera.position.set(
    view.t[0]+view.r*Math.sin(view.pol)*Math.sin(view.az),
    view.t[1]+view.r*Math.cos(view.pol),
    view.t[2]+view.r*Math.sin(view.pol)*Math.cos(view.az));
  camera.lookAt(view.t[0],view.t[1],view.t[2]);
}
applyCamera();
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.localClippingEnabled=true;
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

const MAT=new THREE.LineBasicMaterial({color:0x000000});
const HIDE=new THREE.MeshBasicMaterial({visible:false});
const FILL=new THREE.MeshBasicMaterial({color:0xffffff,polygonOffset:true,polygonOffsetFactor:2,polygonOffsetUnits:2});
const OUTMAT=new THREE.LineBasicMaterial({color:0x000000});
const OUTFILL=new THREE.MeshBasicMaterial({color:0xffffff,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
function ol(o){o.material=OUTMAT;return o;}

/* 水汽、水波这类「额外」的透明线条材质。它们不是 MAT/FILL，所以要单独登记才能跟着
   日夜换色、跟着灯锥裁剪 —— 不然夜里点灯，水汽会是白线画在白底上。 */
const TINT=[];

function V(x,y,z){return new THREE.Vector3(x,y,z);}
function geo(pts){const a=[];for(const p of pts)a.push(V(p[0],p[1],p[2]));return new THREE.BufferGeometry().setFromPoints(a);}
function line(pts){return new THREE.Line(geo(pts),MAT);}
function loop(pts){return new THREE.LineLoop(geo(pts),MAT);}
function edge(g,t){
  const grp=new THREE.Group();
  grp.add(new THREE.Mesh(g,FILL));
  grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,t===undefined?20:t),MAT));
  return grp;
}
function box(w,h,d){return edge(new THREE.BoxGeometry(w,h,d));}
function put(o,x,y,z,rx,ry,rz,parent){o.position.set(x,y,z);if(rx)o.rotation.x=rx;if(ry)o.rotation.y=ry;if(rz)o.rotation.z=rz;(parent||scene).add(o);return o;}
function circleXY(r,n){const a=[];n=n||40;for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push([Math.cos(t)*r,Math.sin(t)*r,0]);}return loop(a);}
function circleXZ(r,n){const a=[];n=n||40;for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push([Math.cos(t)*r,0,Math.sin(t)*r]);}return loop(a);}
function circleZY(r,n){const a=[];n=n||40;for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push([0,Math.cos(t)*r,Math.sin(t)*r]);}return loop(a);}
function rectXY(w,h){return loop([[-w/2,-h/2,0],[w/2,-h/2,0],[w/2,h/2,0],[-w/2,h/2,0]]);}
function fillCircle(r,n){return new THREE.Mesh(new THREE.CircleGeometry(r,n||40),FILL);}
function fillPlane(w,h){return new THREE.Mesh(new THREE.PlaneGeometry(w,h),FILL);}
function E(x){return x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}

/* ---------------- room shell ---------------- */
put(new THREE.Mesh(new THREE.PlaneGeometry(12,12),FILL),0,-0.002,0,-Math.PI/2,0,0);
put(loop([[-6,0,-6],[6,0,-6],[6,0,6],[-6,0,6]]),0,0.01,0);
for(let z=-5.2;z<6;z+=0.8) put(line([[-6,0.011,z],[6,0.011,z]]),0,0,0);
/* 后墙不再是一块实心板 —— 照着左墙掏窗洞的办法掏出门洞，门外才看得见院子 */
const backShape=new THREE.Shape();
backShape.moveTo(-6,0);backShape.lineTo(6,0);backShape.lineTo(6,7);backShape.lineTo(-6,7);backShape.closePath();
const backHole=new THREE.Path();
backHole.moveTo(-5.18,0);backHole.lineTo(-3.32,0);backHole.lineTo(-3.32,4.35);backHole.lineTo(-5.18,4.35);backHole.closePath();
backShape.holes.push(backHole);
put(edge(new THREE.ExtrudeGeometry(backShape,{depth:0.24,bevelEnabled:false})),0,0,-6.24);
const wallShape=new THREE.Shape();
wallShape.moveTo(-6,0);wallShape.lineTo(6,0);wallShape.lineTo(6,7);wallShape.lineTo(-6,7);wallShape.closePath();
const wallHole=new THREE.Path();
wallHole.moveTo(-2.0,2.2);wallHole.lineTo(1.0,2.2);wallHole.lineTo(1.0,4.8);wallHole.lineTo(-2.0,4.8);wallHole.closePath();
wallShape.holes.push(wallHole);
put(edge(new THREE.ExtrudeGeometry(wallShape,{depth:0.24,bevelEnabled:false})),-6.0,0,0,0,-Math.PI/2,0);
put(box(0.82,0.32,0.07),-5.59,0.16,-5.985);   // 踢脚线在门洞处断开
put(box(9.32,0.32,0.07),1.34,0.16,-5.985);
put(box(0.07,0.32,12),-5.985,0.16,0);
put(box(0.82,0.07,0.05),-5.59,1.05,-5.97);    // 护墙板线同样断开
put(box(9.32,0.07,0.05),1.34,1.05,-5.97);
put(box(0.05,0.07,12),-5.97,1.05,0);
put(box(12,0.14,0.09),0,6.86,-5.95);
put(box(0.09,0.14,12),-5.95,6.86,0);
put(rectXY(0.16,0.24),1.9,0.45,-5.955);
const switchG=new THREE.Group(); scene.add(switchG);
put(rectXY(0.16,0.26),-2.95,3.1,-5.955,0,0,0,switchG);
put(rectXY(0.1,0.18),-2.95,3.1,-5.95,0,0,0,switchG);
const knobG=new THREE.Group(); put(knobG,-2.95,3.1,-5.94,0,0,-0.5,switchG);
put(line([[0,-0.05,0],[0,0.05,0]]),0,0,0,0,0,0,knobG);

/* ---------------- door ---------------- */
const doorFrameG=new THREE.Group(); scene.add(doorFrameG);
put(line([[-5.18,0,-5.97],[-5.18,4.35,-5.97]]),0,0,0,0,0,0,doorFrameG);
put(line([[-3.32,0,-5.97],[-3.32,4.35,-5.97]]),0,0,0,0,0,0,doorFrameG);
put(line([[-5.18,4.35,-5.97],[-3.32,4.35,-5.97]]),0,0,0,0,0,0,doorFrameG);
put(line([[-5.08,0,-5.96],[-5.08,4.25,-5.96],[-3.42,4.25,-5.96],[-3.42,0,-5.96]]),0,0,0,0,0,0,doorFrameG);
const doorG=new THREE.Group(); put(doorG,-5.08,0,-5.94);
put(box(1.62,4.2,0.08),0.81,2.1,0,0,0,0,doorG);
put(rectXY(1.1,1.5),0.81,3.3,0.05,0,0,0,doorG);
put(rectXY(1.1,1.7),0.81,1.15,0.05,0,0,0,doorG);
put(circleXY(0.07,16),1.45,2.05,0.06,0,0,0,doorG);
put(rectXY(2.1,1.0),-4.25,0.02,-5.0,-Math.PI/2,0,0);
put(rectXY(1.7,0.66),-4.25,0.02,-5.0,-Math.PI/2,0,0);

/* ---------------- window + sashes + blinds ---------------- */
const WZ=-0.5;
const winFrameG=new THREE.Group(); scene.add(winFrameG);
put(rectXY(3.3,2.9),-5.97,3.5,WZ,0,Math.PI/2,0,winFrameG);
put(ol(rectXY(3.0,2.6)),-5.96,3.5,WZ,0,Math.PI/2,0,winFrameG);
put(box(0.3,0.1,3.6),-5.85,2.02,WZ,0,0,0,winFrameG);
const sashL=new THREE.Group(); put(sashL,-6.05,3.5,WZ-1.5);
const sashR=new THREE.Group(); put(sashR,-6.05,3.5,WZ+1.5);
function sashGeo(parent,dir){
  const z0=0.03*dir,z1=1.47*dir,zm=dir*0.75;
  put(ol(loop([[0,-1.25,z0],[0,-1.25,z1],[0,1.25,z1],[0,1.25,z0]])),0,0,0,0,0,0,parent);
  put(ol(line([[0,0,z0],[0,0,z1]])),0,0,0,0,0,0,parent);
  put(ol(line([[0,-1.25,zm],[0,1.25,zm]])),0,0,0,0,0,0,parent);
}
sashGeo(sashL,1); sashGeo(sashR,-1);
const blindG=new THREE.Group(); scene.add(blindG);
const blindTop=4.72,nSlat=9;
put(box(0.07,0.14,3.0),-5.9,blindTop+0.07,WZ,0,0,0,blindG);
const slats=[],spread=[],collapsed=[];
for(let i=0;i<nSlat;i++){
  slats.push(put(ol(line([[-5.9,0,WZ-1.38],[-5.9,0,WZ+1.38]])),0,0,0,0,0,0,blindG));
  spread.push(2.32+i*0.27);
  collapsed.push(4.42-(nSlat-1-i)*0.055);
}
const cords=[put(ol(line([[0,0,0],[0,-1,0]])),-5.9,blindTop,WZ-0.9,0,0,0,blindG),put(ol(line([[0,0,0],[0,-1,0]])),-5.9,blindTop,WZ+0.9,0,0,0,blindG)];

/* outside view (independent of room light) */
const outsideG=new THREE.Group(); put(outsideG,-8,2.8,-1.9);
put(new THREE.Mesh(new THREE.PlaneGeometry(4.6,3.6),OUTFILL),0,0,0,0,Math.PI/2,0,outsideG);

/* ---------------- desk, drawer, lamp, mug, chair ---------------- */
put(box(1.15,0.09,3.5),-5.25,2.25,-0.5);
for(const lx of [-5.72,-4.78]) for(const lz of [-2.15,1.15]) put(box(0.08,2.2,0.08),lx,1.1,lz);
const drawerG=new THREE.Group(); put(drawerG,-5.25,1.9,0.55);
put(box(0.95,0.48,1.15),0,0,0,0,0,0,drawerG);
put(loop([[0.48,-0.19,-0.5],[0.48,-0.19,0.5],[0.48,0.19,0.5],[0.48,0.19,-0.5]]),0,0,0,0,0,0,drawerG);
put(line([[0.49,0,-0.22],[0.49,0,0.22]]),0,0,0,0,0,0,drawerG);
put(rectXY(0.55,0.75),-5.15,2.30,-0.45,-Math.PI/2,0,0.15);
put(line([[-5.0,2.31,0.08],[-4.75,2.31,0.23]]),0,0,0);

const lampG=new THREE.Group(); put(lampG,-5.45,2.3,-1.65);
put(edge(new THREE.CylinderGeometry(0.2,0.24,0.06,14)),0,0.03,0,0,0,0,lampG);
const armG=new THREE.Group(); put(armG,0,0.06,0,0,0,0,lampG);
put(line([[0,0,0],[0.18,0.7,0]]),0,0,0,0,0,0,armG);
put(line([[0.18,0.7,0],[0.62,1.02,0]]),0,0,0,0,0,0,armG);
put(edge(new THREE.CylinderGeometry(0.09,0.2,0.26,10)),0.66,0.98,0,0,0,-1.1,armG);
const rays=new THREE.Group(); armG.add(rays); rays.visible=false;
put(line([[0.82,0.95,0],[1.05,0.7,0]]),0,0,0,0,0,0,rays);
put(line([[0.72,0.82,0],[0.85,0.5,0]]),0,0,0,0,0,0,rays);
put(line([[0.9,1.06,0],[1.2,0.95,0]]),0,0,0,0,0,0,rays);

const mugG=new THREE.Group(); put(mugG,-5.1,2.3,0.8);
put(edge(new THREE.CylinderGeometry(0.14,0.12,0.3,14)),0,0.15,0,0,0,0,mugG);
put(circleXZ(0.115,20),0,0.305,0,0,0,0,mugG);
const handle=[]; for(let i=0;i<=12;i++){const t=-Math.PI/2+i/12*Math.PI;handle.push([0.13+0.12*Math.cos(t),0.15+0.12*Math.sin(t),0]);}
put(line(handle),0,0,0,0,0,0,mugG);
const steamMats=[],steamLines=[];
const steamG=new THREE.Group(); put(steamG,0,0.34,0,0,0,0,mugG);
for(let j=0;j<3;j++){
  const m=new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.8});
  steamMats.push(m);
  TINT.push(m);   // 登记进「额外线条材质」，才会跟着日夜换色 + 跟着灯锥裁剪
  const l=new THREE.Line(geo([[0,0,0],[0,0.1,0]]),m);
  l.position.x=(j-1)*0.09; l.userData.noBold=true; steamG.add(l); steamLines.push(l);
}

const chairG=new THREE.Group(); put(chairG,-3.7,0,-0.4);
put(box(0.9,0.08,0.9),0,1.15,0,0,0,0,chairG);
for(const lx of [-0.38,0.38]) for(const lz of [-0.38,0.38]) put(box(0.07,1.12,0.07),lx,0.56,lz,0,0,0,chairG);
put(box(0.07,1.15,0.07),0.4,1.72,-0.36,0,0,0,chairG);
put(box(0.07,1.15,0.07),0.4,1.72,0.36,0,0,0,chairG);
put(box(0.06,0.45,0.78),0.42,2.02,0,0,0,0,chairG);

/* ---------------- bookshelf, books, cabinet ---------------- */
put(box(0.07,5.3,0.75),3.15,2.65,-5.575);
put(box(0.07,5.3,0.75),5.35,2.65,-5.575);
for(const y of [0.06,1.6,2.85,4.05,5.25]) put(box(2.13,0.06,0.7),4.25,y,-5.56);
put(box(2.2,0.08,0.78),4.25,5.32,-5.575);
const wa=[0.16,0.13,0.20,0.15,0.18,0.12,0.22,0.14,0.17,0.13];
const ha=[1.08,0.98,1.18,0.95,1.12,1.02,1.22,1.0,1.1,0.92];
let cx=3.30, bookG=null;
for(let i=0;i<wa.length;i++){
  const g=new THREE.Group(); put(g,cx+wa[i]/2,1.63,-5.56);
  put(box(wa[i],ha[i],0.5),0,ha[i]/2,0,0,0,0,g);
  if(i===4) bookG=g;
  cx+=wa[i]+0.015;
}
const wb=[0.14,0.19,0.13,0.17,0.21,0.15,0.12,0.18];
const hb=[1.12,1.04,1.18,1.0,1.1,1.2,0.98,1.08];
cx=3.30;
for(let i=0;i<wb.length;i++){
  put(box(wb[i],hb[i],0.5),cx+wb[i]/2,2.88+hb[i]/2,-5.56);
  cx+=wb[i]+0.015;
}
put(box(0.16,1.12,0.5),5.02,3.42,-5.56,0,0,0.2);
put(box(0.55,0.07,0.4),3.6,4.115,-5.56,0,0.12,0);
put(box(0.5,0.06,0.38),3.62,4.18,-5.56,0,-0.1,0);
put(box(0.58,0.07,0.42),3.58,4.25,-5.56,0,0.05,0);
put(edge(new THREE.CylinderGeometry(0.09,0.13,0.42,10)),4.6,4.29,-5.56);
put(line([[3.25,0.85,-5.9],[5.25,0.85,-5.9]]),0,0,0);
const cabL=new THREE.Group(); put(cabL,3.185,0.83,-5.2);
put(box(1.03,1.5,0.05),0.515,0,0,0,0,0,cabL);
put(line([[0.9,0,0.03],[0.9,0,0.12]]),0,0,0,0,0,0,cabL);
const cabR=new THREE.Group(); put(cabR,5.315,0.83,-5.2);
put(box(1.03,1.5,0.05),-0.515,0,0,0,0,0,cabR);
put(line([[-0.9,0,0.03],[-0.9,0,0.12]]),0,0,0,0,0,0,cabR);

/* ---------------- wall clock (real time) ---------------- */
const clockG=new THREE.Group(); scene.add(clockG);
put(fillCircle(0.72),-0.8,4.7,-5.965,0,0,0,clockG);
put(circleXY(0.72),-0.8,4.7,-5.96,0,0,0,clockG);
for(let i=0;i<12;i++){
  const a=i/12*Math.PI*2,c=Math.cos(a),s=Math.sin(a),r0=(i%3===0?0.54:0.60);
  put(line([[c*r0,s*r0,0],[c*0.68,s*0.68,0]]),-0.8,4.7,-5.955,0,0,0,clockG);
}
const hourH=put(line([[0,-0.06,0],[0,0.3,0]]),-0.8,4.7,-5.945,0,0,0,clockG);
const minH=put(line([[0,-0.08,0],[0,0.5,0]]),-0.8,4.7,-5.94,0,0,0,clockG);
const secH=put(line([[0,-0.12,0],[0,0.56,0]]),-0.8,4.7,-5.938,0,0,0,clockG);
put(circleXY(0.05,12),-0.8,4.7,-5.935,0,0,0,clockG);
put(fillPlane(1.3,1.5),-0.8,3.23,-5.97,0,0,0,clockG);
put(rectXY(1.3,1.5),-0.8,3.23,-5.965,0,0,0,clockG);
const pendG=new THREE.Group(); put(pendG,-0.8,3.9,-5.93,0,0,0,clockG);
put(line([[0,0,0],[0,-1.05,0]]),0,0,0,0,0,0,pendG);
put(circleXY(0.15,20),0,-1.18,0,0,0,0,pendG);

const items=[],proxies=[];
function proxy(w,h,d,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),HIDE);m.position.set(x,y,z);return m;}
function mkItem(px,cfg){
  const it=Object.assign({p:0,target:0,rate:1.6,v:0,tv:0,apply:null,action:null,bold:null,boldClones:[]},cfg);
  if(!it.action) it.action=function(){it.target=it.target?0:1;};
  (Array.isArray(px)?px:[px]).forEach(m=>{m.userData.it=it;scene.add(m);proxies.push(m);});
  items.push(it); return it;
}

/* ================================================================
   院子 —— 门外那一片中式小院
   和房间用完全同一套原语（edge/box/line/loop/circleXX）搭，所以院子的每一根线
   自动获得三件事：白填充遮挡家具、夜晚配色反相、灯锥裁剪 —— 一行额外处理都不用。
   ================================================================ */
const YX0=-6.24,YX1=6.24,YZ0=-14.60,YZ1=-6.24;
const YW=YX1-YX0,YD=YZ1-YZ0,YCZ=(YZ0+YZ1)/2;
const WALL_H=2.35,WALL_T=0.24,YWZ=YZ0+WALL_T/2;

/* --- 地面 + 石板缝 + 散水 --- */
put(new THREE.Mesh(new THREE.PlaneGeometry(YW,YD),FILL),0,-0.006,YCZ,-Math.PI/2,0,0);
put(loop([[YX0,0.008,YZ0],[YX1,0.008,YZ0],[YX1,0.008,YZ1],[YX0,0.008,YZ1]]),0,0,0);
for(let x=YX0+1.2;x<YX1-0.01;x+=1.2) put(line([[x,0.009,YZ0],[x,0.009,YZ1]]),0,0,0);
for(let z=YZ0+1.2;z<YZ1-0.01;z+=1.2) put(line([[YX0,0.009,z],[YX1,0.009,z]]),0,0,0);
put(loop([[YX0+0.55,0.010,YZ0+0.55],[YX1-0.55,0.010,YZ0+0.55],[YX1-0.55,0.010,YZ1-0.55],[YX0+0.55,0.010,YZ1-0.55]]),0,0,0);

/* --- 院墙：左右两道 + 远墙（远墙留门洞） + 瓦檐压顶 --- */
put(box(WALL_T,WALL_H,YD),YX0+WALL_T/2,WALL_H/2,YCZ);
put(box(WALL_T,WALL_H,YD),YX1-WALL_T/2,WALL_H/2,YCZ);
const GATE_X0=-5.20,GATE_X1=-3.30,GATE_H=2.17;
put(box(GATE_X0-YX0,WALL_H,WALL_T),(YX0+GATE_X0)/2,WALL_H/2,YWZ);
put(box(YX1-GATE_X1,WALL_H,WALL_T),(GATE_X1+YX1)/2,WALL_H/2,YWZ);
put(box(GATE_X1-GATE_X0,WALL_H-GATE_H,WALL_T),(GATE_X0+GATE_X1)/2,(GATE_H+WALL_H)/2,YWZ);
const CAP_H=0.14,CAP_W=WALL_T+0.16,CAP_Y=WALL_H+CAP_H/2;
put(box(CAP_W,CAP_H,YD),YX0+WALL_T/2,CAP_Y,YCZ);
put(box(CAP_W,CAP_H,YD),YX1-WALL_T/2,CAP_Y,YCZ);

/* ---------------- hover bold (fat lines) ---------------- */
let BOLDMAT=null;
let BOLDMAT_OUT=null;
if(THREE.LineSegments2&&THREE.LineSegmentsGeometry&&THREE.LineMaterial){
  BOLDMAT=new THREE.LineMaterial({color:0x000000,linewidth:1.5});
  BOLDMAT.resolution.set(window.innerWidth,window.innerHeight);
  BOLDMAT.polygonOffset=true;
  BOLDMAT.polygonOffsetFactor=-2;
  BOLDMAT.polygonOffsetUnits=-2;
  BOLDMAT_OUT=new THREE.LineMaterial({color:0x000000,linewidth:1.5});
  BOLDMAT_OUT.resolution.set(window.innerWidth,window.innerHeight);
  BOLDMAT_OUT.polygonOffset=true;
  BOLDMAT_OUT.polygonOffsetFactor=-2;
  BOLDMAT_OUT.polygonOffsetUnits=-2;
}
function lineSegments(o){
  const pos=o.geometry.attributes.position;
  if(!pos)return null;
  const arr=[];
  if(o.isLineSegments){
    for(let i=0;i<pos.count;i++) arr.push(pos.getX(i),pos.getY(i),pos.getZ(i));
  }else if(o.isLine||o.isLineLoop){
    const n=pos.count;
    for(let i=0;i<n-1;i++) arr.push(pos.getX(i),pos.getY(i),pos.getZ(i),pos.getX(i+1),pos.getY(i+1),pos.getZ(i+1));
    if(o.isLineLoop&&n>2) arr.push(pos.getX(n-1),pos.getY(n-1),pos.getZ(n-1),pos.getX(0),pos.getY(0),pos.getZ(0));
  }else return null;
  return arr;
}
function boldify(root,out){
  const targets=[];
  root.traverse(o=>{
    if((o.isLine||o.isLineLoop||o.isLineSegments)&&!o.userData.noBold) targets.push(o);
  });
  targets.forEach(o=>{
    const seg=lineSegments(o);
    if(!seg||!seg.length)return;
    const g=new THREE.LineSegmentsGeometry();
    g.setPositions(seg);
    const b=new THREE.LineSegments2(g,o.material===OUTMAT?BOLDMAT_OUT:BOLDMAT);
    b.visible=false;
    o.add(b);
    out.push(b);
  });
}
if(BOLDMAT){
  items.forEach(it=>{
    if(!it.bold)return;
    (Array.isArray(it.bold)?it.bold:[it.bold]).forEach(r=>boldify(r,it.boldClones));
  });
}

/* ---------------- picking + hover ---------------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let hovered=null;
function pick(e){
  ndc.x=(e.clientX/window.innerWidth)*2-1;
  ndc.y=-(e.clientY/window.innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(proxies,false);
  return hits.length?hits[0].object.userData.it:null;
}
function setHover(it){
  if(hovered===it)return;
  if(hovered)hovered.boldClones.forEach(b=>{b.visible=false;});
  hovered=it;
  if(hovered)hovered.boldClones.forEach(b=>{b.visible=true;});
  document.body.style.cursor=it?'pointer':'';
}
/* 拖动 = 转视角，点击 = 用物件。靠位移阈值（4px）区分，所以按下去不动还是原来的「点击」。 */
let drag=null;
window.addEventListener('pointerdown',e=>{
  RoomAudio.unlock();
  if(isUI(e))return;
  drag={x:e.clientX,y:e.clientY,moved:false,az:view.az,pol:view.pol};
  if(renderer.domElement.setPointerCapture){try{renderer.domElement.setPointerCapture(e.pointerId);}catch(err){}}
});
window.addEventListener('pointermove',e=>{
  if(drag){
    if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>4)drag.moved=true;
    if(drag.moved){
      viewGoal=null;                 // 用户一拖就接管，取消正在进行的区域缓动
      view.az=drag.az-(e.clientX-drag.x)*0.0083;
      view.pol=Math.max(0.10,Math.min(1.42,drag.pol+(e.clientY-drag.y)*0.0060));
      document.body.style.cursor='grabbing';
      return;
    }
  }
  if(isUI(e)){setHover(null);return;}
  setHover(pick(e));
});
window.addEventListener('pointerup',e=>{
  if(!drag)return;
  const moved=drag.moved;
  drag=null;
  document.body.style.cursor='';
  if(!moved&&!isUI(e)){const it=pick(e);if(it&&it.action)it.action(it);}
  setHover(pick(e));
});
window.addEventListener('pointercancel',()=>{drag=null;document.body.style.cursor='';});
window.addEventListener('wheel',e=>{
  if(isUI(e))return;
  view.r=Math.max(6,Math.min(40,view.r+e.deltaY*0.012));
},{passive:true});
window.addEventListener('pointerleave',()=>{setHover(null);});
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  if(BOLDMAT)BOLDMAT.resolution.set(window.innerWidth,window.innerHeight);
  if(BOLDMAT_OUT)BOLDMAT_OUT.resolution.set(window.innerWidth,window.innerHeight);
});

function obstacles(){

  add(-2.45,-5.85,1.65,-4.05);                         // 沙发
  add(-1.70,-3.00,0.90,-1.60);                         // 茶几
  add(-6.00,3.00,-5.00,4.80);                          // 边柜
  add(4.15,2.85,5.10,3.95);                            // 盆栽
  add(4.55,-3.45,5.45,-2.55);                          // 地球仪
  add(0.85,2.25,1.55,2.95);                            // 球

  /* 后墙：门洞两侧是实墙；门关着时门洞也封上 —— 这就是「必须门开着才能进院子」 */

  else add(-5.86,-5.98,-5.15,-4.35);                   // 门扇往屋里敞着，别从门扇里穿过去

  /* 院子 */
  add(-6.30,-14.70,-6.00,-6.24);                       // 左院墙
  add( 6.00,-14.70, 6.30,-6.24);                       // 右院墙
  add(-6.30,-14.70,-5.20,-14.36);                      // 远墙门洞左侧
  add(-3.30,-14.70, 6.30,-14.36);                      // 远墙门洞右侧
  if(!devOn(DEV.gate)) add(-5.20,-14.70,-3.30,-14.36); // 院门关着
  add(-5.72,-7.55,-5.53,-7.36);                        // 门廊柱

  add(3.44,-12.08,3.80,-11.72);                        // 老树干

/* --- 0.25m 的占据网格 + A*。加了院子之后房间不再是正方形，网格改成矩形：
       x 方向 47 格（覆盖 -5.75~5.75），z 方向 81 格（覆盖 -14.30~5.70）。
       3807 格，每次寻路重算依然绰绰有余。 --- */
const CELL=0.25,GRID_X0=-5.75,GNX=47,GRID_Z0=-14.30,GNZ=81;
const GRID_X1=GRID_X0+(GNX-1)*CELL,GRID_Z1=GRID_Z0+(GNZ-1)*CELL;
const grid=new Uint8Array(GNX*GNZ);
const GIDX=(i,j)=>i*GNZ+j;
let OBS=[];
function buildGrid(){
  OBS=obstacles();
  for(let i=0;i<GNX;i++)for(let j=0;j<GNZ;j++){
    const x=GRID_X0+i*CELL,z=GRID_Z0+j*CELL;
    let ok=x>GRID_X0+MAN_R&&x<GRID_X1-MAN_R&&z>GRID_Z0+MAN_R&&z<GRID_Z1-MAN_R;
    if(ok)for(const b of OBS){if(x>b[0]-MAN_R&&x<b[2]+MAN_R&&z>b[1]-MAN_R&&z<b[3]+MAN_R){ok=false;break;}}
    grid[GIDX(i,j)]=ok?1:0;
  }
}
function freeAt(x,z){
  const i=Math.round((x-GRID_X0)/CELL),j=Math.round((z-GRID_Z0)/CELL);
  return i<0||j<0||i>=GNX||j>=GNZ?false:grid[GIDX(i,j)]===1;
}
function nearestFree(x,z){
  let i=Math.max(0,Math.min(GNX-1,Math.round((x-GRID_X0)/CELL)));
  let j=Math.max(0,Math.min(GNZ-1,Math.round((z-GRID_Z0)/CELL)));
  if(grid[GIDX(i,j)])return [GRID_X0+i*CELL,GRID_Z0+j*CELL];
  for(let r=1;r<20;r++)for(let a=-r;a<=r;a++)for(let b=-r;b<=r;b++){
    if(Math.max(Math.abs(a),Math.abs(b))!==r)continue;
    const ii=i+a,jj=j+b;
    if(ii<0||jj<0||ii>=GNX||jj>=GNZ)continue;
    if(grid[GIDX(ii,jj)])return [GRID_X0+ii*CELL,GRID_Z0+jj*CELL];
  }
  return null;
}
function los(x0,z0,x1,z1){
  const d=Math.hypot(x1-x0,z1-z0),n=Math.ceil(d/0.12);
  for(let k=1;k<=n;k++){const u=k/n;if(!freeAt(x0+(x1-x0)*u,z0+(z1-z0)*u))return false;}
  return true;
}
function findPath(sx,sz,tx,tz){
  buildGrid();
  const s=nearestFree(sx,sz),t=nearestFree(tx,tz);
  if(!s||!t)return [];
  const si=Math.round((s[0]-GRID_X0)/CELL),sj=Math.round((s[1]-GRID_Z0)/CELL);
  const ti=Math.round((t[0]-GRID_X0)/CELL),tj=Math.round((t[1]-GRID_Z0)/CELL);
  const N=GNX*GNZ,idx=GIDX;
  const g=new Float32Array(N).fill(Infinity),f=new Float32Array(N).fill(Infinity);
  const from=new Int32Array(N).fill(-1),closed=new Uint8Array(N);
  const h=(i,j)=>Math.hypot(i-ti,j-tj);
  const start=idx(si,sj),goal=idx(ti,tj);
  const open=[start];g[start]=0;f[start]=h(si,sj);
  while(open.length){
    let bi=0;for(let k=1;k<open.length;k++)if(f[open[k]]<f[open[bi]])bi=k;
    const cur=open.splice(bi,1)[0];
    if(cur===goal)break;
    if(closed[cur])continue;
    closed[cur]=1;
    const ci=Math.floor(cur/GNZ),cj=cur%GNZ;
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
      if(!a&&!b)continue;
      const ni=ci+a,nj=cj+b;
      if(ni<0||nj<0||ni>=GNX||nj>=GNZ)continue;
      const nk=idx(ni,nj);
      if(!grid[nk]||closed[nk])continue;
      if(a&&b&&(!grid[idx(ci+a,cj)]||!grid[idx(ci,cj+b)]))continue; // 不许贴着家具角穿过去
      const ng=g[cur]+(a&&b?1.414:1);
      if(ng<g[nk]){g[nk]=ng;f[nk]=ng+h(ni,nj);from[nk]=cur;open.push(nk);}
    }
  }
  if(goal!==start&&from[goal]<0)return [];
  const cells=[];let c=goal;
  while(c!==-1&&cells.length<=N){cells.push(c);c=from[c];}
  cells.reverse();
  const pts=cells.map(k=>[GRID_X0+Math.floor(k/GNZ)*CELL,GRID_Z0+(k%GNZ)*CELL]);
  pts[0]=[s[0],s[1]];pts[pts.length-1]=[t[0],t[1]];
  const out=[];let i=0;
  while(i<pts.length-1){          // 拉直：能直视就直接跳过中间点
    let j=pts.length-1;
    for(;j>i+1;j--)if(los(pts[i][0],pts[i][1],pts[j][0],pts[j][1]))break;
    out.push(pts[j]);i=j;
  }
  return out;
}

/* --- 走路的推进器和任务队列 --- */
const path=[];
let queue=[],waitT=0,agentNear='房间中间';
let emote=null,emoteT=0;

function angDelta(a,b){return ((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;}
function startEmote(kind){emote=kind;emoteT=0.9;}

/* --- 相机：小线换了区域就缓动到那套预设。阈值带迟滞，免得他站在门槛上镜头来回抖。 --- */
function stepCamera(dt){
  if(viewGoal===null){
    const inY=viewZone==='yard'?man.z<-5.9:man.z<-6.3;
    const want=inY?'yard':'room';
    if(want!==viewZone){viewZone=want;viewGoal=PRESET[want];}
  }
  if(viewGoal){
    const k=Math.min(1,dt*1.7),gd=angDelta(view.az,viewGoal.az);
    view.az+=gd*k;
    view.pol+=(viewGoal.pol-view.pol)*k;
    view.r+=(viewGoal.r-view.r)*k;
    for(let i=0;i<3;i++)view.t[i]+=(viewGoal.t[i]-view.t[i])*k;
    if(Math.abs(gd)<0.008&&Math.abs(view.pol-viewGoal.pol)<0.008&&Math.abs(view.r-viewGoal.r)<0.06){
      view.az=viewGoal.az;view.pol=viewGoal.pol;view.r=viewGoal.r;
      view.t=viewGoal.t.slice();viewGoal=null;
    }
  }
  applyCamera();
}

/* 目标在「另一个区域」而门关着 —— 先把「走去开门」插到队列最前面。
   于是「去院子里点灯笼」实际会走成：走到门口 → 开门（有声音）→ 穿过门洞 → 到灯笼下 → 点亮。
   「进院子必须门开着」这条规则于是变成用户看得见的一串动作，而不只是一条隐形限制。 */
function planRoute(name){
  const q=[],goal=standOf(name);
  if(!goal)return q;
  if((goal[1]<YZ1)!==inYard()&&!devOn(DEV.door)){
    q.push({t:'go',p:standOf('door'),name:'door'});
    q.push({t:'exec',name:'door',op:'on'});
  }
  q.push({t:'go',p:goal,name:name});
  return q;
}

const Agent={
  go(target){
    let p=null,name=null;
    if(Array.isArray(target))p=target;
    else if(standOf(target)){p=standOf(target);name=target;}
    else if(inYard())p=[-5.2+Math.random()*10.0,-14.0+Math.random()*6.6];
    else p=[(Math.random()-0.5)*9,(Math.random()-0.5)*9];
    path.length=0;
    path.push(...findPath(man.x,man.z,p[0],p[1]));
    if(name)agentNear=NICE[name]||name;
  },
  use(name,op){
    if(!DEV[name])return;
    queue.length=0;path.length=0;
    queue.push(...planRoute(name));
    queue.push({t:'exec',name:name,op:op||'toggle'});
  },
  emote:startEmote,
  look(){path.length=0;queue.length=0;man.rot=Math.atan2(camera.position.x-man.x,camera.position.z-man.z);},
  pos(){return {x:+man.x.toFixed(2),z:+man.z.toFixed(2),rot:man.rot,at:agentNear};}
};

function stepAgent(dt,t){
  let guard=0;
  while(!path.length&&waitT<=0&&queue.length&&guard++<8){
    const job=queue.shift();
    if(job.t==='wait'){waitT=job.d;break;}
    if(job.t==='exec'){
      Room.exec(job.name,job.op);
      if(job.emote)startEmote(job.emote);
      waitT=0.4;
      break;
    }
    if(job.t==='go'){
      path.push(...findPath(man.x,man.z,job.p[0],job.p[1]));
      if(job.name)agentNear=NICE[job.name]||job.name;
    }
  }
  if(waitT>0)waitT=Math.max(0,waitT-dt);

  let moving=false;
  if(path.length){
    const wp=path[0],dx=wp[0]-man.x,dz=wp[1]-man.z,d=Math.hypot(dx,dz);
    if(d<0.10)path.shift();
    else{
      man.rot+=angDelta(man.rot,Math.atan2(dx,dz))*Math.min(1,dt*7.5);   // 先转身
      const align=Math.cos(angDelta(man.rot,Math.atan2(dx,dz)));
      const ease=d<1.0?Math.max(0.32,d):1;                                // 快到了就减速
      const spd=MAN_SPEED*ease*(align>0.55?1:0.05);                       // 没转过来就不迈步
      man.x+=Math.sin(man.rot)*spd*dt;
      man.z+=Math.cos(man.rot)*spd*dt;
      moving=true;
    }
  }
  man.speed+=((moving?1:0)-man.speed)*Math.min(1,dt*(moving?5:6));

  const sw=Math.sin(man.phase+=dt*(5.4*man.speed+0.5)),amp=0.6*man.speed;
  legPiv[0].rotation.x=sw*amp;legPiv[1].rotation.x=-sw*amp;
  armPiv[0].rotation.x=-sw*amp*0.75;armPiv[1].rotation.x=sw*amp*0.75;
  let bob=Math.abs(sw)*0.035*man.speed+Math.sin(t*1.7)*0.012*(1-man.speed);
  if(man.speed<0.06){                     // 站着的时候别僵住
    armPiv[0].rotation.x=Math.sin(t*1.3)*0.06;
    armPiv[1].rotation.x=Math.sin(t*1.3+1.1)*0.06;
  }
  if(emoteT>0){
    emoteT-=dt;
    const k=Math.max(0,emoteT/0.9);
    if(emote==='wave'){armPiv[1].rotation.z=-2.3*k;armPiv[1].rotation.x=Math.sin(t*15)*0.3*k;}
    else if(emote==='jump')bob+=Math.abs(Math.sin(t*6))*0.22*k;
    else if(emote==='nod')manBody.rotation.x=Math.sin(t*13)*0.13*k;
    else if(emote==='look')manG.rotation.y=man.rot+Math.sin(t*1.6)*0.6*k;
    if(emoteT<=0){armPiv[1].rotation.set(0,0,0);manBody.rotation.x=0;emote=null;}
  }
  manG.position.set(man.x,bob,man.z);
  manG.rotation.y=emote==='look'&&emoteT>0?manG.rotation.y:man.rot;
  manProxy.position.set(man.x,0.95,man.z);
}

/* --- 对外接口：后端下发的动作都从这里落到场景上 --- */
const Room={
  devices:DEV,
  exec(name,op){
    const d=DEV[name];
    if(!d||!d.it)return false;
    if(d.kind==='pulse'||op==='press'){d.it.action(d.it);return true;}
    const on=devOn(d);
    if(op==='toggle')d.it.action(d.it);
    else if(op==='on'){if(!on)d.it.action(d.it);}
    else if(op==='off'){if(on)d.it.action(d.it);}
    else return false;
    return true;
  },
  state(){const s={};for(const k in DEV)s[k]=devOn(DEV[k]);return s;},
  agent:Agent,
  near(){return agentNear;},
  has(name){return !!DEV[name];}
};
window.Room=Room;

   ================================================================ */
const chatLog=document.getElementById('log'),chatIn=document.getElementById('msg'),bubbleEl=document.getElementById('bubble');
const BUBBLE_HEAD=new THREE.Vector3();
let cursor=0,bubbleT=0,online=false,everOnline=false;

function isUI(e){return !!(e.target&&e.target.closest&&e.target.closest('.ui'));}
function pushLog(role,text){
  if(!chatLog)return;
  const d=document.createElement('div');
  d.className=role;
  d.textContent=(role==='u'?'我：':'小线：')+text;
  chatLog.appendChild(d);
  while(chatLog.children.length>60)chatLog.removeChild(chatLog.firstChild);
  chatLog.scrollTop=chatLog.scrollHeight;
}
function sayBubble(text,hold){
  if(!bubbleEl)return;
  bubbleEl.textContent=text;
  bubbleEl.classList.add('on');
  bubbleT=hold||4.2;
}
function applyEvent(e){
  if(e.type==='say'){pushLog('a',e.text);sayBubble(e.text);}
  else if(e.type==='go')Agent.go(e.target);
  else if(e.type==='use')Agent.use(e.device,e.op);
  else if(e.type==='emote')startEmote(e.kind);
}
let polling=false,fails=0;
async function poll(){
  if(polling)return;
  polling=true;
  while(true){
    try{
      const r=await fetch('/events?since='+cursor,{cache:'no-store'});
      if(!r.ok)throw new Error(r.status);
      const j=await r.json();
      cursor=j.cursor;
      for(const e of j.events||[])applyEvent(e);
      if(fails>4&&everOnline)pushLog('a','诶，你回来啦。');
      fails=0;online=true;everOnline=true;
    }catch(err){
      fails++;
      if(fails===5&&everOnline)pushLog('a','（连不上服务器了）');
      online=false;
      if(fails>6){polling=false;return;}   // 别一直刷失败请求；下次发消息会重新拉起
    }
    await new Promise(res=>setTimeout(res,fails?Math.min(700*fails,3000):380));
  }
}
async function sendChat(){
  if(!chatIn)return;
  const text=chatIn.value.trim();
  if(!text)return;
  chatIn.value='';
  pushLog('u',text);
  sayBubble('……',9);
  Agent.look();
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const j=await r.json();
    if(j.reply){pushLog('a',j.reply);sayBubble(j.reply);}
    (j.actions||[]).forEach(a=>Agent.use(a.device,a.op));
    if(j.emote)startEmote(j.emote);
    if(!polling){fails=0;poll();}   // 服务器回来了就重新开始轮询
  }catch(err){
    pushLog('a','（他没听见——要先启动 server）');
    sayBubble('诶？');
  }
}
if(chatIn){
  document.getElementById('send').addEventListener('click',sendChat);
  chatIn.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();sendChat();}});
}
function reportState(){
  fetch('/state',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({room:Room.state(),agent:Agent.pos()})}).catch(()=>{});
}
const _pollT=setInterval(reportState,1200);
void _pollT;
poll();

/* --- 每帧：小人 + 头顶气泡 --- */
function updateLife(dt,t){
  stepAgent(dt,t);
  if(bubbleT>0){
    bubbleT-=dt;
    if(bubbleT<=0)bubbleEl&&bubbleEl.classList.remove('on');
  }
  if(bubbleEl&&bubbleEl.classList.contains('on')){
    BUBBLE_HEAD.set(man.x,2.2,man.z).project(camera);
    bubbleEl.style.left=((BUBBLE_HEAD.x*0.5+0.5)*window.innerWidth)+'px';
    bubbleEl.style.top=((-BUBBLE_HEAD.y*0.5+0.5)*window.innerHeight)+'px';
  }
}

/* ---------------- light system ---------------- */
const lightState={night:false,switchOn:false};
function updateLight(){
  const d=new Date();
  const h=d.getHours()+d.getMinutes()/60;
  lightState.night=(h>=19||h<7);
  const roomNight=lightState.night&&!lightState.switchOn;
  document.body.classList.toggle('night',roomNight);
  scene.background.set(roomNight?0x000000:0xffffff);
  MAT.color.set(roomNight?0xffffff:0x000000);
  FILL.color.set(roomNight?0x000000:0xffffff);
  if(BOLDMAT)BOLDMAT.color.set(roomNight?0xffffff:0x000000);
  if(BOLDMAT_OUT)BOLDMAT_OUT.color.set(lightState.night?0xffffff:0x000000);
  for(const m of TINT)m.color.set(roomNight?0xffffff:0x000000);
  OUTFILL.color.set(lightState.night?0x000000:0xffffff);
  OUTMAT.color.set(lightState.night?0xffffff:0x000000);
  const wOpen=windowIt.p>0.4||inYard();   // 小线在院子里也听得见窗外/院外的动静
  RoomAudio.loop('dayAmb',!lightState.night&&wOpen);
  RoomAudio.loop('nightAmb',lightState.night&&wOpen);
  RoomAudio.loop('hum',lightState.night&&lightState.switchOn);
}

/* --- 灯：24 个裁剪面围成一个无限光锥，「锥内」用白天配色重画一遍。
       clippingPlanes 只能表达「与」，两盏灯是「或」，所以做法是**一盏亮着的灯多画一遍**。
       台灯那盏的参数是从原来的 coneA / (-3.12,-1.25,-3.12) 逐字搬过来的，夜景基线一个数没动。 --- */
function cone(cx,cy,cz,spread,ratio){
  const A=new THREE.Vector3(cx,cy,cz),arr=[];
  for(let k=0;k<24;k++){
    const ph=k*Math.PI/12;
    const n=new THREE.Vector3(-spread*Math.cos(ph),-ratio,-spread*Math.sin(ph)).normalize();
    const pl=new THREE.Plane(n,-n.dot(A));
    pl.userData={c:-n.dot(A)};
    arr.push(pl);
  }
  return arr;
}
const LIGHTS=[
  {planes:cone(-4.80,3.15,-1.65,3.12,1.25),on:()=>lampIt.p>0.55},        // 台灯（原样）
  {planes:cone(-4.25,2.35,-7.45,1.60,1.00),on:()=>devOn(DEV.lantern)>0}  // 灯笼
];
function applyClip(planes){
  MAT.clippingPlanes=planes;
  FILL.clippingPlanes=planes;
  for(const m of TINT)m.clippingPlanes=planes;
}
function setClip(planes,on){for(const p of planes)p.constant=on?p.userData.c:1e10;}
applyClip(null);
function renderNightLit(){
  const BG=scene.background;
  applyClip(null);
  renderer.autoClear=true;
  renderer.render(scene,camera);
  scene.background=null;
  renderer.autoClear=false;
  MAT.color.set(0x000000);FILL.color.set(0xffffff);
  for(const L of LIGHTS){
    if(!L.on())continue;
    applyClip(L.planes);
    setClip(L.planes,true);
    renderer.render(scene,camera);
    setClip(L.planes,false);
  }
  MAT.color.set(0xffffff);FILL.color.set(0x000000);
  applyClip(null);
  scene.background=BG;
}

RoomAudio.loop('steam',true);RoomAudio.loop('chimes',true);RoomAudio.loop('plantSway',true);

/* ---------------- loop ---------------- */
const clockT=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clockT.getDelta(),0.05),t=clockT.elapsedTime;
  for(const it of items){
    if(it.p<it.target) it.p=Math.min(it.target,it.p+dt*it.rate);
    else if(it.p>it.target) it.p=Math.max(it.target,it.p-dt*it.rate);
    it.v+=(it.tv-it.v)*Math.min(1,dt*2.2);
    if(it.apply) it.apply(it,dt,t);
  }
  updateLight();
  updateLife(dt,t);
  stepCamera(dt);
  if(lightState.night&&!lightState.switchOn&&LIGHTS.some(L=>L.on())) renderNightLit();
  else{renderer.autoClear=true;renderer.render(scene,camera);}
}
animate();
})();
</script>
